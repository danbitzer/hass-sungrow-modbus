name: Publish library to PyPI

# Tag the library release as lib-vX.Y.Z; the tag must equal the version in
# packages/sungrow-inverter/pyproject.toml (moved with scripts/sync_version.py).
on:
  push:
    tags: ["lib-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the library version
        run: |
          tag="${GITHUB_REF_NAME#lib-v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/sungrow-inverter/pyproject.toml)"
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }
      - run: uv build
        working-directory: packages/sungrow-inverter
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/sungrow-inverter/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
