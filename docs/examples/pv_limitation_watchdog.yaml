# PV limitation watchdog: tell me when PV did not come back.
#
# Two things can leave the PV off after a negative-price window:
#   A. the limitation is still ON although Numbat no longer asks for it
#      (a lost write, a dead actuator, an app change) — "failed to un-limit";
#   B. the limitation is OFF but PV sits near zero while the battery runs
#      the house in daylight — the SH-T stall seen after a PV restore
#      (lifting and re-applying the export limit clears it).
#
# Built from UI-editable triggers and conditions (state / numeric state), so
# every threshold can be changed in the visual editor. Needs the Open-Meteo
# Solar Forecast integration for the stall check
# (sensor.home_power_production_now, W). Paste into Settings → Automations →
# Create → Edit in YAML; adjust entity ids if your device is not "Sungrow
# SH15T", the notify service to your phone, and the device id in the
# restore step (pick the device in the visual editor).
alias: Sungrow PV limitation watchdog
description: Notify when PV stays limited or stalled after Numbat releases it.
mode: single
triggers:
  # A. "failed to un-limit": either side of the mismatch has held 10 minutes
  - trigger: state
    id: stuck_on
    entity_id: switch.sungrow_sh15t_pv_limitation
    to: "on"
    for:
      minutes: 10
  - trigger: state
    id: stuck_on
    entity_id: sensor.numbat_action
    attribute: pv_off
    to: false
    for:
      minutes: 10
  # B. "stalled": PV near zero, or the battery carrying the house, for 10 min
  - trigger: numeric_state
    id: stalled
    entity_id: sensor.sungrow_sh15t_pv_power
    below: 150
    for:
      minutes: 10
  - trigger: numeric_state
    id: stalled
    entity_id: sensor.sungrow_sh15t_battery_power
    above: 300
    for:
      minutes: 10
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: stuck_on
          - condition: state
            entity_id: switch.sungrow_sh15t_pv_limitation
            state: "on"
            for:
              minutes: 10
          - condition: state
            entity_id: sensor.numbat_action
            attribute: pv_off
            state: false
            for:
              minutes: 10
          - condition: state
            entity_id: sensor.numbat_status
            state: ok
        sequence:
          - action: notify.mobile_app_dans_iphone
            data:
              title: PV still limited
              message: >-
                PV limitation has been on for 10 minutes while Numbat is not
                asking for it. Restoring PV.
              data:
                tag: sungrow-pv-watchdog
          # Self-heal: the same call the actuator would make. Delete this
          # step if you only want the notification.
          - action: sungrow.set_pv_limitation
            data:
              device_id: YOUR_SUNGROW_DEVICE_ID
              limit: false
      - conditions:
          - condition: trigger
            id: stalled
          - condition: state
            entity_id: switch.sungrow_sh15t_pv_limitation
            state: "off"
          # the forecast says PV should be producing (allows for cloud)
          - condition: numeric_state
            entity_id: sensor.home_power_production_now
            above: 1500
          - condition: numeric_state
            entity_id: sensor.sungrow_sh15t_load_power
            above: 300
          # the 10-minute persistence is on the triggers above
          - condition: numeric_state
            entity_id: sensor.sungrow_sh15t_pv_power
            below: 150
          - condition: numeric_state
            entity_id: sensor.sungrow_sh15t_battery_power
            above: 300
        sequence:
          - action: notify.mobile_app_dans_iphone
            data:
              title: PV stalled
              message: >-
                PV is near zero in daylight with the limitation off while the
                battery runs the house. Lifting and re-applying the export
                limit usually clears it.
              data:
                tag: sungrow-pv-watchdog
