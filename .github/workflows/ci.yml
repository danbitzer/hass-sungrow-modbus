name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: Library (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # A plain venv, not the workspace: the workspace root requires Python
      # 3.14 (Home Assistant), the library itself supports 3.12+.
      - name: Install the library and test tools
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e packages/sungrow-inverter pytest pytest-asyncio ruff build
      - name: Ruff
        run: |
          source .venv/bin/activate
          ruff format --check packages/sungrow-inverter
          ruff check packages/sungrow-inverter
      - name: Tests
        working-directory: packages/sungrow-inverter
        run: |
          source ../../.venv/bin/activate
          pytest -q
      - name: Build
        working-directory: packages/sungrow-inverter
        run: |
          source ../../.venv/bin/activate
          python -m build

  workspace:
    name: Workspace checks (integration, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: scripts/check.sh

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
